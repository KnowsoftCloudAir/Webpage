{% extends "base.html" %}
{% block title %}{{ svc.title }} — Knowsoft Consult LTD{% endblock %}
{% block content %}
<div class="page-hero"><div class="container">
  <a href="{{ url_for('services_index') }}" class="text-white-50 small text-decoration-none">← All services</a>
  <h1 class="mt-2">{{ svc.title }}</h1>
</div></div>
<section><div class="container"><div class="row justify-content-center"><div class="col-lg-8">
  <div class="card-ks p-4 p-md-5">
    <div class="icon-box mb-3"><i class="bi {{ svc.icon }}"></i></div>
    <p class="lead">{{ svc.summary }}</p>
    <p>{{ svc.body }}</p>
    <a href="{{ url_for('request_consulting') }}?service={{ svc.title|urlencode }}" class="btn btn-ks mt-2">Request this service</a>
  </div>
</div></div></div></section>
{% endblock %}
