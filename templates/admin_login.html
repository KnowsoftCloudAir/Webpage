<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/site.css') }}" rel="stylesheet">
</head>
<body class="restricted-bg" style="min-height:100vh;background:linear-gradient(160deg,#0b6e6e,#0d1b24);display:flex;align-items:center;justify-content:center">
<div class="card shadow" style="width:100%;max-width:400px;border-radius:1rem">
  <div class="card-body p-4">
    <div class="text-center mb-3"><img src="{{ url_for('static', filename='img/knowsoft_logo.png') }}" alt="" style="height:48px"></div>
    <h1 class="h5 text-center mb-3">Portal</h1>
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="alert alert-{{ cat }} py-2">{{ msg }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required autofocus></div>
      <button class="btn btn-ks w-100">Continue</button>
    </form>
  </div>
</div>
</body></html>
