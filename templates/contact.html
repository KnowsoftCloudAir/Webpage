{% extends "base.html" %}
{% block title %}Contact — Knowsoft Consult LTD{% endblock %}
{% block content %}
<div class="page-hero"><div class="container"><h1>Contact</h1></div></div>
<section><div class="container"><div class="row g-5">
<div class="col-lg-5">
  <h3 class="fw-bold">Knowsoft Consult LTD</h3>
  <p class="mb-2"><i class="bi bi-geo-alt-fill me-2" style="color:var(--ks-teal)"></i>{{ content.address }}</p>
  <p class="mb-2"><i class="bi bi-envelope-fill me-2" style="color:var(--ks-teal)"></i><a href="mailto:{{ content.email }}">{{ content.email }}</a></p>
  <p class="mb-4"><i class="bi bi-telephone-fill me-2" style="color:var(--ks-teal)"></i><a href="tel:{{ content.phone }}">{{ content.phone }}</a></p>
  <a href="{{ url_for('request_consulting') }}" class="btn btn-ks">Request consulting</a>
</div>
<div class="col-lg-7">
  <div class="card-ks p-4">
    <form method="post">
      <div class="mb-3"><label class="form-label">Name *</label><input name="name" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Email *</label><input type="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">Message *</label><textarea name="message" class="form-control" rows="4" required></textarea></div>
      <button class="btn btn-ks">Send</button>
    </form>
  </div>
</div>
</div></div></section>
{% endblock %}
